services:
  - type: web
    name: video-frame-extractor
    runtime: python
    repo: https://github.com/NeuralBishal/video-frame-extractor
    plan: free
    region: oregon
    buildCommand: pip install -r requirements.txt
    startCommand: streamlit run app.py --server.port $PORT --server.address 0.0.0.0
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.8
